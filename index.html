<script>
// ===== CONFIG =====
const TOKEN = "cCCbFgv5g7lTL2CEsAQcmOgO86ee52rm";

const API_TEAMS   = "https://api.baserow.io/api/database/rows/table/TEAM_ID/?user_field_names=true";
const API_MATCHES = "https://api.baserow.io/api/database/rows/table/MATCH_ID/?user_field_names=true";
const API_RANKS   = "https://api.baserow.io/api/database/rows/table/RANK_ID/?user_field_names=true";

// ===== GLOBAL =====
let teams = [];
let matches = [];
let ranks = [];

// ===== PARSE =====
function val(f){
  if(!f) return null;
  if(Array.isArray(f)) return f[0]?.value || f[0]?.name || f[0];
  if(typeof f==='object') return f.value || f.name;
  return f;
}

// ===== LOAD ALL =====
async function loadAll(){
  try{
    const [tRes,mRes,rRes] = await Promise.all([
      fetch(API_TEAMS,{headers:{Authorization:"Token "+TOKEN}}),
      fetch(API_MATCHES,{headers:{Authorization:"Token "+TOKEN}}),
      fetch(API_RANKS,{headers:{Authorization:"Token "+TOKEN}})
    ]);

    teams   = (await tRes.json()).results;
    matches = (await mRes.json()).results;
    ranks   = (await rRes.json()).results;

    normalize();
    renderAll();

  }catch(e){
    console.error(e);
    document.getElementById('loading').innerHTML = "❌ Lỗi load API";
  }
}

// ===== NORMALIZE =====
function normalize(){
  matches = matches.map(m=>({
    id:m.id,
    stage:String(val(m.stage)||'group').toLowerCase(),
    group:String(val(m.group)||'A').toUpperCase(),
    teamA:getTeam(m.teamA),
    teamB:getTeam(m.teamB),
    scoreA:m.scoreA!=null?parseInt(m.scoreA):null,
    scoreB:m.scoreB!=null?parseInt(m.scoreB):null
  }));

  teams = teams.map(t=>({
    id:t.id,
    name:val(t.name) || val(t.team) || ("Team "+t.id)
  }));

  ranks = ranks.map(r=>({
    team:getTeam(r.team),
    points:parseInt(r.points||0),
    diff:parseInt(r.diff||0)
  }));
}

// ===== MAP TEAM =====
function getTeam(field){
  if(!field) return 'TBD';
  if(Array.isArray(field)) return field[0]?.name || field[0]?.value || field[0];
  if(typeof field==='object') return field.name || field.value;
  return field;
}

// ===== RENDER =====
function renderAll(){
  renderGroup();
  renderBracket();
  renderRanking();
  document.getElementById('loading').style.display='none';
}

// ===== GROUP =====
function renderGroup(){
  const gDiv=document.getElementById('tab-groups');
  let html='';
  matches.filter(m=>m.stage==='group').forEach(m=>{
    html+=`
    <div class="match-card">
      <div>${m.teamA}</div>
      <input value="${m.scoreA??''}" onchange="save(${m.id},'A',this.value)">
      <div>${m.teamB}</div>
      <input value="${m.scoreB??''}" onchange="save(${m.id},'B',this.value)">
    </div>`;
  });
  gDiv.innerHTML=html;
}

// ===== BRACKET =====
function renderBracket(){
  const div=document.getElementById('tab-bracket');
  let html='';
  ['quarter','semi','final'].forEach(stage=>{
    html+=`<h3>${stage}</h3>`;
    matches.filter(m=>m.stage===stage).forEach(m=>{
      html+=`
      <div class="match-card">
        ${m.teamA} (${m.scoreA??'-'}) vs ${m.teamB} (${m.scoreB??'-'})
      </div>`;
    });
  });
  div.innerHTML=html;
}

// ===== RANK =====
function renderRanking(){
  const div=document.getElementById('tab-rankings');
  let html='';
  ranks.sort((a,b)=>b.points-a.points).forEach((r,i)=>{
    html+=`
    <div class="ranking-item">
      ${i+1}. ${r.team} - ${r.points}đ
    </div>`;
  });
  div.innerHTML=html;
}

// ===== SAVE SCORE =====
async function save(id,side,val){
  const body={};
  if(side==='A') body.scoreA = val===''?null:parseInt(val);
  if(side==='B') body.scoreB = val===''?null:parseInt(val);

  await fetch(API_MATCHES.replace('?user_field_names=true','')+id+"/?user_field_names=true",{
    method:'PATCH',
    headers:{
      Authorization:'Token '+TOKEN,
      'Content-Type':'application/json'
    },
    body:JSON.stringify(body)
  });

  loadAll();
}

// ===== INIT =====
loadAll();
setInterval(loadAll,5000);
</script>
