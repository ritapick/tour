<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ĐÔI 5.2 - Hoàng Quốc Việt Pickleball 2026</title>
<style>
  :root {
    --primary: #2ecc71;
    --primary-dark: #27ae60;
    --danger: #e74c3c;
    --warning: #f39c12;
    --dark: #2c3e50;
    --light: #ecf0f1;
  }
  
  * { box-sizing: border-box; }
  
  body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    color: #fff;
    padding: 10px;
    min-height: 100vh;
  }

  h1 {
    text-align: center;
    color: #00ff88;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    margin: 10px 0 5px;
    font-size: clamp(18px, 5vw, 32px);
    font-weight: 700;
  }
  
  h2.title {
    text-align: center;
    color: #fff;
    margin: 0 0 15px;
    font-size: clamp(14px, 4vw, 24px);
    text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
  }

  .link-bar {
    text-align: center;
    margin: 10px 0 15px;
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  
  .link-bar a {
    color: #fff;
    background: var(--dark);
    padding: 8px 16px;
    border-radius: 20px;
    text-decoration: none;
    font-weight: 500;
    transition: all 0.3s;
    border: 1px solid #555;
  }
  
  .link-bar a:hover {
    background: var(--primary);
    transform: translateY(-2px);
  }

  .block {
    background: rgba(255,255,255,0.95);
    color: #333;
    padding: 12px;
    border-radius: 12px;
    margin-bottom: 15px;
    border: 2px solid #444;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  }

  .section-title {
    padding: 10px 12px;
    font-weight: 700;
    background: linear-gradient(90deg, var(--dark), var(--primary-dark));
    color: #fff;
    margin: 0 0 12px;
    border-radius: 8px;
    font-size: clamp(14px, 2vw, 18px);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  
  .section-title .refresh-btn {
    background: rgba(255,255,255,0.2);
    border: none;
    color: #fff;
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
  }
  
  .section-title .refresh-btn:hover {
    background: rgba(255,255,255,0.4);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: clamp(10px, 1.8vw, 14px);
  }

  th {
    background: #34495e;
    color: #fff;
    padding: 8px 6px;
    font-weight: 600;
    text-align: center;
  }

  td {
    border: 1px solid #bdc3c7;
    padding: 6px 8px;
    text-align: center;
    vertical-align: middle;
  }

  tr:nth-child(even) { background: #f8f9fa; }
  tr:hover { background: #e8f4f8; }

  /* Score cell editable */
  .score-cell {
    min-width: 50px;
    position: relative;
  }
  
  .score-input {
    width: 100%;
    padding: 4px 6px;
    border: 2px solid #ddd;
    border-radius: 4px;
    text-align: center;
    font-weight: 600;
    font-size: inherit;
    transition: border-color 0.2s;
  }
  
  .score-input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 2px rgba(46, 204, 113, 0.3);
  }
  
  .score-input.saved {
    border-color: var(--primary);
    background: #d4edda;
  }
  
  .score-input.error {
    border-color: var(--danger);
    background: #f8d7da;
  }

  /* Save button */
  .save-btn {
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 11px;
    font-weight: 600;
    margin-top: 4px;
    transition: all 0.2s;
    width: 100%;
  }
  
  .save-btn:hover {
    background: var(--primary-dark);
    transform: translateY(-1px);
  }
  
  .save-btn:disabled {
    background: #95a5a6;
    cursor: not-allowed;
    transform: none;
  }
  
  .save-btn.saving {
    background: var(--warning);
    cursor: wait;
  }

  /* Status message */
  .status-msg {
    padding: 8px 12px;
    margin: 8px 0;
    border-radius: 6px;
    font-size: 13px;
    display: none;
  }
  
  .status-msg.success {
    background: #d4edda;
    color: #155724;
    border: 1px solid #c3e6cb;
    display: block;
  }
  
  .status-msg.error {
    background: #f8d7da;
    color: #721c24;
    border: 1px solid #f5c6cb;
    display: block;
  }

  /* Scrollable doi cards */
  .doi-scroll {
    display: flex;
    gap: 12px;
    overflow-x: auto;
    padding: 8px 4px;
    scrollbar-width: thin;
  }
  
  .doi-scroll::-webkit-scrollbar {
    height: 6px;
  }
  
  .doi-scroll::-webkit-scrollbar-thumb {
    background: #95a5a6;
    border-radius: 3px;
  }
  
  .doi-card {
    min-width: 180px;
    max-width: 220px;
    background: #fff;
    border-radius: 10px;
    padding: 10px;
    border: 1px solid #ddd;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }

  /* Bracket/Sodo */
  .sodo-wrapper {
    overflow: auto;
    width: 100%;
    height: 400px;
    border: 1px solid #ddd;
    border-radius: 8px;
    background: #fff;
  }
  
  .sodo-wrapper iframe {
    width: 1400px;
    height: 700px;
    border: none;
  }

  /* Loading */
  .loading {
    text-align: center;
    padding: 20px;
    color: #7f8c8d;
  }
  
  .loading::after {
    content: "⏳ Đang tải dữ liệu...";
  }

  /* Toast notification */
  .toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: var(--dark);
    color: #fff;
    padding: 12px 20px;
    border-radius: 8px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    z-index: 1000;
    animation: slideIn 0.3s ease;
    max-width: 350px;
    font-size: 14px;
  }
  
  .toast.success { border-left: 4px solid var(--primary); }
  .toast.error { border-left: 4px solid var(--danger); }
  
  @keyframes slideIn {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  /* Responsive */
  @media (max-width: 600px) {
    .block { padding: 8px; }
    td, th { padding: 4px 5px; }
    .doi-card { min-width: 150px; }
  }
</style>
</head>
<body>

<h1>🏆 HOÀNG QUỐC VIỆT PICKLEBALL 2026</h1>
<h2 class="title">ĐÔI 5.2 - ĐƠN DƯƠNG</h2>
<h2 class="title">📅 04/04/2026</h2>

<div class="link-bar">
  <a href="https://ductrong49.github.io/Pick/" target="_blank">🏠 Trang chủ</a>
  <a href="https://ductrong49.github.io/Pick/48.html" target="_blank">🎾 Giải 4.8</a>
  <button onclick="refreshAll()" style="background:#3498db;color:#fff;border:none;padding:8px 16px;border-radius:20px;cursor:pointer;">🔄 Làm mới</button>
</div>

<div id="toast-container"></div>

<!-- DANH SÁCH ĐỘI -->
<div class="block">
  <div class="section-title">
    <span>👥 DANH SÁCH ĐỘI</span>
    <button class="refresh-btn" onclick="loadDoiOrdered()">↻</button>
  </div>
  <div id="sheet-doi" class="loading"></div>
</div>

<!-- BẢNG THI ĐẤU -->
<div class="block">
  <div class="section-title">
    <span>📊 BẢNG THI ĐẤU</span>
    <button class="refresh-btn" onclick="loadBangOrdered()">↻</button>
  </div>
  <div id="sheet-bang" class="loading"></div>
</div>

<!-- VÒNG LOẠI 1/8 -->
<div class="block">
  <div class="section-title">
    <span>🔥 VÒNG LOẠI 1/8</span>
    <button class="refresh-btn" onclick="loadSheet18()">↻</button>
  </div>
  <div id="sheet-18" class="loading"></div>
</div>

<!-- BÁN KẾT -->
<div class="block">
  <div class="section-title">
    <span>🥈 BÁN KẾT</span>
    <button class="refresh-btn" onclick="loadSheetBK()">↻</button>
  </div>
  <div id="sheet-bk" class="loading"></div>
</div>

<!-- CHUNG KẾT -->
<div class="block">
  <div class="section-title">
    <span>🥇 CHUNG KẾT</span>
    <button class="refresh-btn" onclick="loadSheetCK()">↻</button>
  </div>
  <div id="sheet-ck" class="loading"></div>
</div>

<!-- SƠ ĐỒ -->
<div class="block">
  <div class="section-title">🗺️ SƠ ĐỒ THI ĐẤU</div>
  <div class="sodo-wrapper">
    <iframe src="https://docs.google.com/spreadsheets/d/1gZz2QRiqqGtxdNdo-UV0Cqz5No0kLqQItTAGb9hPGgo/edit?gid=1139851199#gid=1139851199"></iframe>
  </div>
</div>

<script>
// ============ CẤU HÌNH ============
const SHEET_ID = "1gZz2QRiqqGtxdNdo-UV0Cqz5No0kLqQItTAGb9hPGgo";
const CONFIG = {
  doi: [
    {range:"A1:B5", label:"Bảng A"},
    {range:"A7:B11", label:"Bảng B"},
    {range:"A13:B17", label:"Bảng C"},
    {range:"A19:B23", label:"Bảng D"}
  ],
  bang: [
    {range:"A2:G8", label:"BẢNG A"},
    {range:"A11:G17", label:"BẢNG B"},
    {range:"A20:G26", label:"BẢNG C"},
    {range:"A29:G35", label:"BẢNG D"}
  ],
  scoreCols: {
    // Định nghĩa cột điểm có thể chỉnh sửa theo sheet
    "bang": [4, 5],      // Cột E, F (index 4,5) là điểm
    "1.8": [3, 4],       // Cột D, E
    "bk": [2, 3],        // Cột C, D
    "ck": [2]            // Cột C
  }
};

// ============ UTILS ============
function showToast(message, type = 'success', duration = 3000) {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = message;
  container.appendChild(toast);

  setTimeout(() => {
    toast.style.animation = 'slideIn 0.3s ease reverse';
    setTimeout(() => toast.remove(), 300);
  }, duration);
}

function showLoading(elementId) {
  document.getElementById(elementId).innerHTML = '<div class="loading"></div>';
}

// ============ GOOGLE SCRIPT CALLS ============
function callServer(func, ...args) {
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(reject)
      [func](...args);
  });
}

// ============ LOAD DATA ============
async function loadSheetData(sheetName, range) {
  try {
    const result = await callServer('getSheetData', sheetName, range);
    if (result.error) throw new Error(result.error);
    return result;
  } catch (e) {
    console.error(`Lỗi tải ${sheetName}:${range}`, e);
    return null;
  }
}

// ============ RENDER TABLE WITH EDITABLE SCORES ============
function renderTable(data, sheetName, config = {}) {
  if (!data || data.error) {
    return `<div style="padding:12px;color:#c0392b;text-align:center">
      ⚠️ ${data?.error || 'Không thể tải dữ liệu'}
    </div>`;
  }

  const { values, formatted, rows, cols } = data;
  const scoreCols = CONFIG.scoreCols[sheetName] || [];
  
  let html = '<table><thead><tr>';
  
  // Header
  for (let c = 0; c < cols; c++) {
    const header = formatted[0]?.[c] || `Cột ${String.fromCharCode(65+c)}`;
    html += `<th>${header}</th>`;
  }
  html += '<th>Thao tác</th></tr></thead><tbody>';
  
  // Body rows (skip header row)
  for (let r = 1; r < rows; r++) {
    html += '<tr>';
    for (let c = 0; c < cols; c++) {
      const cellValue = values[r]?.[c] ?? '';
      const cellDisplay = formatted[r]?.[c] ?? '';
      const isScoreCell = scoreCols.includes(c);
      const rowIdx = r + 1; // 1-based for Apps Script
      const colIdx = c + 1;
      const cellLabel = `${String.fromCharCode(64+colIdx)}${rowIdx}`;
      
      if (isScoreCell) {
        html += `
          <td class="score-cell">
            <input type="text" class="score-input" 
                   id="score_${sheetName}_${r}_${c}"
                   value="${cellDisplay}"
                   data-sheet="${sheetName}"
                   data-row="${rowIdx}"
                   data-col="${colIdx}"
                   data-label="${cellLabel}"
                   placeholder="-">
            <button class="save-btn" onclick="saveScoreCell(this)">💾 Lưu</button>
          </td>
        `;
      } else {
        // Format đặc biệt cho một số sheet
        let display = cellDisplay;
        if (["bang", "1.8", "bk"].includes(sheetName) && (c === 2 || c === 3)) {
          display = display.toString().replace(/ - /g, "<br>");
        }
        html += `<td>${display || ''}</td>`;
      }
    }
    html += '<td><small style="color:#7f8c8d">Sửa điểm → Lưu</small></td></tr>';
  }
  
  html += '</tbody></table>';
  return html;
}

// ============ SAVE SCORE ============
async function saveScoreCell(btn) {
  const cell = btn.previousElementSibling;
  const sheetName = cell.dataset.sheet;
  const row = parseInt(cell.dataset.row);
  const col = parseInt(cell.dataset.col);
  const label = cell.dataset.label;
  const value = cell.value.trim();
  
  // UI states
  const originalBtnText = btn.textContent;
  btn.disabled = true;
  btn.textContent = '⏳';
  btn.classList.add('saving');
  cell.classList.remove('saved', 'error');
  
  try {
    const result = await callServer('saveScore', sheetName, row, col, value, label);
    
    if (result.success) {
      cell.classList.add('saved');
      showToast(result.message, 'success', 2500);
      // Auto-refresh related section after 2s
      setTimeout(() => {
        if (sheetName === 'bang') loadBangOrdered();
        else if (sheetName === '1.8') loadSheet18();
        else if (sheetName === 'bk') loadSheetBK();
        else if (sheetName === 'ck') loadSheetCK();
      }, 2000);
    } else {
      throw new Error(result.error);
    }
  } catch (e) {
    cell.classList.add('error');
    showToast(`❌ Lỗi: ${e.message}`, 'error', 4000);
    console.error('Save error:', e);
  } finally {
    btn.disabled = false;
    btn.textContent = originalBtnText;
    btn.classList.remove('saving');
  }
}

// ============ LOAD SECTIONS ============
async function loadDoiOrdered() {
  showLoading('sheet-doi');
  let html = '<div class="doi-scroll">';
  
  for (const cfg of CONFIG.doi) {
    const data = await loadSheetData('doi', cfg.range);
    html += `<div class="doi-card">
      <div style="font-weight:700;color:var(--dark);margin-bottom:8px;text-align:center">
        ${cfg.label}
      </div>`;
    html += renderTable(data, 'doi');
    html += '</div>';
  }
  html += '</div>';
  document.getElementById('sheet-doi').innerHTML = html;
}

async function loadBangOrdered() {
  showLoading('sheet-bang');
  let html = '';
  
  for (const cfg of CONFIG.bang) {
    const data = await loadSheetData('bang', cfg.range);
    html += `<div style="margin-bottom:20px">
      <div style="background:#34495e;color:#fff;padding:6px 10px;border-radius:4px;margin-bottom:8px;font-weight:600">
        ${cfg.label}
      </div>`;
    html += renderTable(data, 'bang');
    html += '</div>';
  }
  document.getElementById('sheet-bang').innerHTML = html;
}

async function loadSheet18() {
  showLoading('sheet-18');
  const data = await loadSheetData('1.8', 'A1:E12');
  document.getElementById('sheet-18').innerHTML = renderTable(data, '1.8');
}

async function loadSheetBK() {
  showLoading('sheet-bk');
  const data = await loadSheetData('bk', 'A1:D7');
  document.getElementById('sheet-bk').innerHTML = renderTable(data, 'bk');
}

async function loadSheetCK() {
  showLoading('sheet-ck');
  const data = await loadSheetData('ck', 'A2:C4');
  document.getElementById('sheet-ck').innerHTML = renderTable(data, 'ck');
}

async function refreshAll() {
  showToast('🔄 Đang làm mới dữ liệu...', 'success', 1500);
  await Promise.all([
    loadDoiOrdered(),
    loadBangOrdered(), 
    loadSheet18(),
    loadSheetBK(),
    loadSheetCK()
  ]);
  showToast('✅ Đã cập nhật dữ liệu mới!', 'success');
}

// ============ INIT ============
document.addEventListener('DOMContentLoaded', () => {
  refreshAll();
  // Auto-refresh every 30 seconds
  setInterval(refreshAll, 30000);
});

// Enter key to save score
document.addEventListener('keypress', (e) => {
  if (e.key === 'Enter' && e.target.classList.contains('score-input')) {
    e.preventDefault();
    const btn = e.target.nextElementSibling;
    if (btn?.classList.contains('save-btn')) {
      saveScoreCell(btn);
    }
  }
});
</script>

</body>
</html>
