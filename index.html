<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏆 Giải Đấu Pickleball</title>
<style>
@import url('https://cdn.jsdelivr.net/npm/fontsource-inter@5.1.0/400.css');
@import url('https://cdn.jsdelivr.net/npm/fontsource-inter@5.1.0/600.css');
@import url('https://cdn.jsdelivr.net/npm/fontsource-inter@5.1.0/700.css');
@import url('https://cdn.jsdelivr.net/npm/fontsource-inter@5.1.0/800.css');

*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:#0a0e1a;color:#e2e8f0;min-height:100vh;overflow-x:hidden;}

/* HEADER */
.header{background:linear-gradient(135deg,#1e3a5f 0%,#0f172a 50%,#1e3a5f 100%);padding:20px 20px 30px;text-align:center;border-bottom:3px solid #f59e0b;position:relative;overflow:hidden;}
.header::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(245,158,11,0.05) 0%,transparent 70%);animation:headerPulse 8s ease-in-out infinite;}
@keyframes headerPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.1);}}
.header h1{font-size:2rem;font-weight:800;color:#f59e0b;text-shadow:0 2px 10px rgba(245,158,11,0.3);position:relative;z-index:1;}
.header .subtitle{font-size:0.9rem;color:#94a3b8;margin-top:5px;position:relative;z-index:1;}
.header img{width:80px;height:80px;margin-bottom:10px;filter:drop-shadow(0 4px 15px rgba(245,158,11,0.4));position:relative;z-index:1;}
.status-bar{display:flex;justify-content:center;gap:20px;margin-top:15px;flex-wrap:wrap;position:relative;z-index:1;}
.status-item{background:rgba(255,255,255,0.08);padding:6px 16px;border-radius:20px;font-size:0.8rem;color:#cbd5e1;display:flex;align-items:center;gap:6px;}
.status-item .dot{width:8px;height:8px;border-radius:50%;background:#22c55e;animation:blink 1.5s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.3;}}

/* TABS */
.tabs{display:flex;justify-content:center;gap:4px;padding:15px 10px;background:#0f172a;position:sticky;top:0;z-index:100;border-bottom:1px solid #1e293b;}
.tab-btn{padding:10px 24px;border:none;background:#1e293b;color:#94a3b8;border-radius:8px;cursor:pointer;font-size:0.9rem;font-weight:600;transition:all 0.3s;font-family:inherit;}
.tab-btn:hover{background:#334155;color:#e2e8f0;}
.tab-btn.active{background:linear-gradient(135deg,#f59e0b,#d97706);color:#0f172a;box-shadow:0 4px 15px rgba(245,158,11,0.3);}

/* MAIN */
.main{max-width:1200px;margin:0 auto;padding:20px 10px 40px;}
.tab-content{display:none;animation:fadeIn 0.4s ease;}
.tab-content.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

/* GROUP STAGE */
.groups-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-bottom:24px;}
.group-card{background:#1e293b;border-radius:12px;overflow:hidden;border:1px solid #334155;transition:all 0.3s;}
.group-card:hover{border-color:#f59e0b55;transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,0,0,0.3);}
.group-header{background:linear-gradient(135deg,#1e3a5f,#0f2744);padding:12px 16px;font-weight:700;font-size:1rem;color:#f59e0b;display:flex;align-items:center;gap:8px;}
.group-header .badge{background:#f59e0b;color:#0f172a;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:800;}

/* MATCH CARDS */
.match-card{background:#0f172a;margin:8px 12px;padding:12px;border-radius:8px;display:flex;align-items:center;justify-content:space-between;gap:10px;transition:all 0.3s;border:1px solid transparent;}
.match-card:hover{background:#1a2332;border-color:#334155;}
.match-card.played{border-left:3px solid #22c55e;}
.match-card.pending{border-left:3px solid #f59e0b;}
.match-teams{flex:1;display:flex;flex-direction:column;gap:6px;}
.match-row{display:flex;align-items:center;gap:8px;font-size:0.85rem;}
.match-row.winner .team-name{color:#22c55e;font-weight:600;}
.team-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.match-row .score{font-weight:700;font-size:1rem;min-width:28px;text-align:center;color:#f59e0b;}
.match-row .score-input{width:40px;padding:4px 2px;text-align:center;background:#1e293b;border:1px solid #334155;border-radius:6px;color:#f1f5f9;font-size:0.9rem;font-family:inherit;outline:none;transition:border-color 0.3s;}
.match-row .score-input:focus{border-color:#f59e0b;box-shadow:0 0 0 2px rgba(245,158,11,0.2);}
.match-row .score-input.saved{border-color:#22c55e;background:#0f271a;}
.match-vs{color:#475569;font-weight:700;font-size:0.75rem;margin:2px 0;}
.match-status{font-size:0.7rem;padding:3px 8px;border-radius:10px;font-weight:600;white-space:nowrap;}
.match-status.done{background:#22c55e22;color:#22c55e;}
.match-status.pending{background:#f59e0b22;color:#f59e0b;}

/* STANDINGS TABLE */
.standings-table{width:100%;border-collapse:collapse;margin:12px 0;font-size:0.8rem;}
.standings-table th{background:#0f172a;color:#94a3b8;padding:8px 10px;text-align:center;font-weight:600;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.5px;}
.standings-table th:first-child{text-align:left;}
.standings-table td{padding:8px 10px;text-align:center;border-top:1px solid #1e293b;}
.standings-table td:first-child{text-align:left;font-weight:600;}
.standings-table tr:hover td{background:#1e293b;}
.standings-table tr.qualified td{background:rgba(34,197,94,0.08);}
.standings-table tr.qualified td:first-child{color:#22c55e;}
.rank-num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;font-size:0.7rem;font-weight:700;}
.rank-1{background:#f59e0b;color:#0f172a;}
.rank-2{background:#64748b;color:#e2e8f0;}
.rank-3{background:#7c3aed;color:#e2e8f0;}
.rank-4{background:#334155;color:#94a3b8;}

/* BRACKET */
.bracket-container{overflow-x:auto;padding:20px 0;}
.bracket{display:flex;align-items:stretch;gap:0;min-width:900px;}
.bracket-round{display:flex;flex-direction:column;justify-content:center;min-width:200px;padding:0 10px;}
.bracket-round-title{text-align:center;font-size:0.75rem;font-weight:700;color:#f59e0b;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;padding:6px 12px;background:rgba(245,158,11,0.1);border-radius:6px;}
.bracket-matches{display:flex;flex-direction:column;justify-content:space-around;flex:1;gap:16px;}
.bracket-match{background:#1e293b;border-radius:10px;padding:10px;border:1px solid #334155;position:relative;transition:all 0.3s;}
.bracket-match:hover{border-color:#f59e0b55;}
.bracket-match.highlight{border-color:#f59e0b;box-shadow:0 0 15px rgba(245,158,11,0.2);}
.bracket-team{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:0.82rem;}
.bracket-team.winner .bracket-team-name{color:#22c55e;font-weight:600;}
.bracket-team-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bracket-team-score{font-weight:700;color:#f59e0b;margin-left:8px;}
.bracket-team.tbd .bracket-team-name{color:#475569;font-style:italic;}
.bracket-connector{width:30px;display:flex;flex-direction:column;justify-content:center;position:relative;}
.bracket-connector::after{content:'';position:absolute;top:50%;left:0;right:0;height:2px;background:#334155;}

/* CHAMPION */
.champion-section{text-align:center;padding:30px 20px;margin-top:20px;}
.champion-card{background:linear-gradient(135deg,#1e3a5f,#0f2744);border:2px solid #f59e0b;border-radius:16px;padding:30px;display:inline-block;max-width:400px;width:100%;position:relative;overflow:hidden;}
.champion-card::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(245,158,11,0.1) 0%,transparent 70%);}
.champion-label{font-size:0.8rem;color:#f59e0b;font-weight:700;text-transform:uppercase;letter-spacing:2px;margin-bottom:10px;position:relative;}
.champion-trophy{font-size:3rem;margin-bottom:10px;position:relative;}
.champion-name{font-size:1.5rem;font-weight:800;color:#fff;position:relative;}
.champion-tbd{color:#475569;font-style:italic;}

/* RANKINGS */
.rankings-container{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;}
.ranking-card{background:#1e293b;border-radius:12px;overflow:hidden;border:1px solid #334155;}
.ranking-header{padding:12px 16px;font-weight:700;color:#f59e0b;border-bottom:1px solid #334155;}
.ranking-body{padding:8px 12px;}
.ranking-item{display:flex;align-items:center;padding:8px 4px;border-bottom:1px solid #0f172a;gap:10px;font-size:0.85rem;}
.ranking-item:last-child{border-bottom:none;}
.ranking-pos{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.75rem;flex-shrink:0;}
.ranking-name{flex:1;font-weight:600;}
.ranking-stats{text-align:right;font-size:0.75rem;color:#94a3b8;}
.ranking-stats span{color:#f59e0b;font-weight:600;}

/* LOADING */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:16px;}
.spinner{width:40px;height:40px;border:3px solid #334155;border-top-color:#f59e0b;border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-text{color:#94a3b8;font-size:0.9rem;}

/* TOAST */
.toast-container{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;}
.toast{padding:12px 20px;border-radius:8px;font-size:0.85rem;font-weight:600;animation:slideIn 0.3s ease;display:flex;align-items:center;gap:8px;box-shadow:0 8px 25px rgba(0,0,0,0.4);}
.toast.success{background:#0f271a;border:1px solid #22c55e;color:#22c55e;}
.toast.error{background:#2a0f0f;border:1px solid #ef4444;color:#ef4444;}
.toast.info{background:#0f172a;border:1px solid #3b82f6;color:#3b82f6;}
@keyframes slideIn{from{opacity:0;transform:translateX(100px);}to{opacity:1;transform:translateX(0);}}

/* RESPONSIVE */
@media(max-width:768px){
  .header h1{font-size:1.4rem;}
  .header img{width:60px;height:60px;}
  .groups-grid{grid-template-columns:1fr;}
  .match-card{flex-direction:column;align-items:flex-start;gap:6px;}
  .match-row{width:100%;}
  .bracket{min-width:700px;}
  .tab-btn{padding:8px 14px;font-size:0.8rem;}
  .status-bar{gap:10px;}
}

/* Scrollbar */
::-webkit-scrollbar{height:6px;width:6px;}
::-webkit-scrollbar-track{background:#0f172a;}
::-webkit-scrollbar-thumb{background:#334155;border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:#475569;}

/* Empty state */
.empty-state{text-align:center;padding:40px 20px;color:#475569;}
.empty-state .icon{font-size:3rem;margin-bottom:10px;}
.empty-state p{font-size:0.9rem;}

/* Pulse animation for live indicator */
.live-dot{width:10px;height:10px;border-radius:50%;background:#22c55e;display:inline-block;animation:pulse 2s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,0.4);}70%{box-shadow:0 0 0 10px rgba(34,197,94,0);}100%{box-shadow:0 0 0 0 rgba(34,197,94,0);}}

/* Footer */
.footer{text-align:center;padding:20px;color:#475569;font-size:0.75rem;border-top:1px solid #1e293b;margin-top:20px;}
</style>
</head>
<body>

<div class="header">
  <img src="https://image.qwenlm.ai/public_source/7c4f8ad5-e306-4d23-91b2-d10f6d405471/1a1f66184-bc00-4d8c-a520-ad7ae451f33b.png" alt="Pickleball Logo">
  <h1>🏆 GIẢI ĐẤU PICKLEBALL</h1>
  <div class="subtitle">Hệ thống quản lý giải đấu trực tiếp</div>
  <div class="status-bar">
    <div class="status-item"><span class="live-dot"></span> Đang đồng bộ</div>
    <div class="status-item" id="lastUpdate">Cập nhật: --:--:--</div>
    <div class="status-item" id="totalMatches">Tổng trận: 0</div>
  </div>
</div>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('groups')">📋 Vòng Bảng</button>
  <button class="tab-btn" onclick="switchTab('bracket')">🏅 Knockout</button>
  <button class="tab-btn" onclick="switchTab('rankings')">📊 Bảng Xếp Hạng</button>
</div>

<div class="main">
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <div class="loading-text">Đang tải dữ liệu...</div>
  </div>

  <div id="tab-groups" class="tab-content active"></div>
  <div id="tab-bracket" class="tab-content"></div>
  <div id="tab-rankings" class="tab-content"></div>
</div>

<div class="footer">
  Pickleball Tournament Manager © 2026 | Đồng bộ dữ liệu tự động mỗi 5s
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
const API_BASE = "https://api.baserow.io/api/database/rows/table/962605/";
const TOKEN = "cCCbFgv5g7lTL2CEsAQcmOgO86ee52rm";

let matchCache = [];
let savingId = null;
let currentTab = 'groups';

// ===== UTILITIES =====
function getTeamName(field) {
  if (!field) return 'TBD';
  if (typeof field === 'string') return field;
  if (Array.isArray(field)) return field.map(f => {
    if (typeof f === 'string') return f;
    if (f && f.value) return f.value;
    return f ? String(f) : 'TBD';
  }).join(' / ');
  if (field.value) return field.value;
  return String(field);
}

function getFieldValue(field) {
  if (field == null) return null;
  if (Array.isArray(field)) {
    if (field.length === 0) return null;
    const f = field[0];
    if (f && f.id) return f.id;
    return f;
  }
  return field;
}

function showToast(msg, type = 'success') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  const icons = { success: '✅', error: '❌', info: 'ℹ️' };
  toast.innerHTML = `<span>${icons[type] || ''}</span> ${msg}`;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(100px)';
    toast.style.transition = 'all 0.3s';
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

function formatTime(ts) {
  if (!ts) return '--:--:--';
  const d = new Date(ts);
  return d.toLocaleTimeString('vi-VN');
}

// ===== TAB SWITCHING =====
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach((btn, i) => {
    btn.classList.toggle('active', ['groups', 'bracket', 'rankings'][i] === tab);
  });
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
}

// ===== LOAD DATA =====
async function loadData() {
  try {
    const res = await fetch(API_BASE, {
      headers: { Authorization: "Token " + TOKEN }
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const rows = data.results || [];

    const newHash = JSON.stringify(rows.map(r => ({ id: r.id, stage: r.stage, scoreA: r.scoreA, scoreB: r.scoreB })));
    const hasChanged = newHash !== JSON.stringify(matchCache);
    matchCache = rows;

    document.getElementById('loading').style.display = hasChanged ? 'flex' : 'none';

    document.getElementById('lastUpdate').textContent = 'Cập nhật: ' + formatTime(new Date().toISOString());
    document.getElementById('totalMatches').textContent = 'Tổng trận: ' + rows.length;

    if (hasChanged) {
      renderAll(rows);
      setTimeout(() => {
        document.getElementById('loading').style.display = 'none';
      }, 500);
    }

    // Auto process advancement
    autoProcess(rows);
  } catch (err) {
    console.error('Load error:', err);
    document.getElementById('loading').innerHTML = `
      <div style="text-align:center;color:#ef4444;">
        <div style="font-size:2rem;margin-bottom:10px;">⚠️</div>
        <p>Lỗi kết nối dữ liệu</p>
        <p style="font-size:0.8rem;color:#94a3b8;margin-top:5px;">${err.message}</p>
      </div>`;
  }
}

// ===== RENDER ALL =====
function renderAll(rows) {
  renderGroupStage(rows);
  renderBracket(rows);
  renderRankings(rows);
}

// ===== GROUP STAGE =====
function renderGroupStage(rows) {
  const groups = ['A', 'B', 'C', 'D'];
  const groupRows = rows.filter(r => r.stage === 'group');

  let html = '<div class="groups-grid">';

  groups.forEach(g => {
    const gMatches = groupRows.filter(r => {
      const grp = r.group || g;
      return grp === g || (typeof grp === 'object' && grp.value === g);
    });

    html += `<div class="group-card">
      <div class="group-header">
        <span class="badge">${g}</span> Bảng ${g}
        <span style="margin-left:auto;font-size:0.7rem;color:#94a3b8;font-weight:400;">${gMatches.length} trận</span>
      </div>`;

    if (gMatches.length === 0) {
      html += `<div class="empty-state"><div class="icon"></div><p>Chưa có trận đấu nào</p></div>`;
    } else {
      gMatches.forEach(m => {
        const scoreA = m.scoreA ?? '';
        const scoreB = m.scoreB ?? '';
        const isPlayed = scoreA !== '' && scoreB !== '';
        const teamAName = getTeamName(m.teamA);
        const teamBName = getTeamName(m.teamB);

        const aIsWinner = isPlayed && scoreA > scoreB;
        const bIsWinner = isPlayed && scoreB > scoreA;

        html += `<div class="match-card ${isPlayed ? 'played' : 'pending'}">
          <div class="match-teams">
            <div class="match-row ${aIsWinner ? 'winner' : ''}">
              <span class="team-name" title="${teamAName}">${teamAName}</span>
              <input type="number" class="score-input" value="${scoreA}" 
                data-id="${m.id}" data-side="a"
                onchange="saveScore(${m.id},'a',this.value)"
                onfocus="this.select()">
            </div>
            <div class="match-vs"> VS</div>
            <div class="match-row ${bIsWinner ? 'winner' : ''}">
              <span class="team-name" title="${teamBName}">${teamBName}</span>
              <input type="number" class="score-input" value="${scoreB}"
                data-id="${m.id}" data-side="b"
                onchange="saveScore(${m.id},'b',this.value)"
                onfocus="this.select()">
            </div>
          </div>
          <span class="match-status ${isPlayed ? 'done' : 'pending'}">
            ${isPlayed ? '✓ Đã đấu' : '⏳ Chưa đấu'}
          </span>
        </div>`;
      });
    }

    html += `</div>`;
  });

  html += '</div>';
  document.getElementById('tab-groups').innerHTML = html;
}

// ===== BRACKET =====
function renderBracket(rows) {
  const qMatches = rows.filter(r => r.stage === 'quarter');
  const sMatches = rows.filter(r => r.stage === 'semi');
  const fMatches = rows.filter(r => r.stage === 'final');

  let html = '<div class="bracket-container"><div class="bracket">';

  // Quarter Finals
  html += renderBracketRound('Tứ Kết', qMatches, 4);

  // Semi Finals
  html += renderBracketRound('Bán Kết', sMatches, 2);

  // Final
  html += renderBracketRound('Chung Kết', fMatches, 1);

  html += '</div></div>';

  // Champion
  html += renderChampion(rows);

  document.getElementById('tab-bracket').innerHTML = html;
}

function renderBracketRound(title, matches, count) {
  let html = `<div class="bracket-round">
    <div class="bracket-round-title">${title}</div>
    <div class="bracket-matches">`;

  if (matches.length === 0) {
    for (let i = 0; i < count; i++) {
      html += `<div class="bracket-match">
        <div class="bracket-team tbd"><span class="bracket-team-name">TBD</span><span class="bracket-team-score">-</span></div>
        <div style="text-align:center;color:#475569;font-size:0.7rem;padding:4px;">vs</div>
        <div class="bracket-team tbd"><span class="bracket-team-name">TBD</span><span class="bracket-team-score">-</span></div>
      </div>`;
    }
  } else {
    matches.forEach(m => {
      const scoreA = m.scoreA ?? '';
      const scoreB = m.scoreB ?? '';
      const teamAName = getTeamName(m.teamA);
      const teamBName = getTeamName(m.teamB);
      const isPlayed = scoreA !== '' && scoreB !== '';
      const aWin = isPlayed && scoreA > scoreB;
      const bWin = isPlayed && scoreB > scoreA;

      html += `<div class="bracket-match">
        <div class="bracket-team ${aWin ? 'winner' : ''} ${!teamAName || teamAName === 'TBD' ? 'tbd' : ''}">
          <span class="bracket-team-name">${teamAName || 'TBD'}</span>
          <span class="bracket-team-score">${scoreA !== '' ? scoreA : '-'}</span>
        </div>
        <div style="text-align:center;color:#475569;font-size:0.7rem;padding:4px;">
          <input type="number" class="score-input" value="${scoreA}" style="width:36px;"
            data-id="${m.id}" data-side="a"
            onchange="saveScore(${m.id},'a',this.value)">
          -
          <input type="number" class="score-input" value="${scoreB}" style="width:36px;"
            data-id="${m.id}" data-side="b"
            onchange="saveScore(${m.id},'b',this.value)">
        </div>
        <div class="bracket-team ${bWin ? 'winner' : ''} ${!teamBName || teamBName === 'TBD' ? 'tbd' : ''}">
          <span class="bracket-team-name">${teamBName || 'TBD'}</span>
          <span class="bracket-team-score">${scoreB !== '' ? scoreB : '-'}</span>
        </div>
      </div>`;
    });
  }

  html += '</div></div>';
  return html;
}

function renderChampion(rows) {
  const finalMatches = rows.filter(r => r.stage === 'final');
  if (finalMatches.length === 0) {
    return `<div class="champion-section">
      <div class="champion-card">
        <div class="champion-label">🏆 Nhà Vô Địch</div>
        <div class="champion-trophy">🏆</div>
        <div class="champion-name champion-tbd">Chưa xác định</div>
      </div>
    </div>`;
  }

  const fm = finalMatches[0];
  const scoreA = fm.scoreA ?? '';
  const scoreB = fm.scoreB ?? '';
  const teamAName = getTeamName(fm.teamA);
  const teamBName = getTeamName(fm.teamB);
  const isPlayed = scoreA !== '' && scoreB !== '';

  let champName = '<span class="champion-tbd">Chưa xác định</span>';
  if (isPlayed) {
    champName = scoreA > scoreB ? teamAName : teamBName;
  }

  return `<div class="champion-section">
    <div class="champion-card">
      <div class="champion-label">🏆 NHÀ VÔ ĐỊCH</div>
      <div class="champion-trophy">${isPlayed ? '🏆' : '⏳'}</div>
      <div class="champion-name">${champName}</div>
      ${isPlayed ? `<div style="margin-top:10px;color:#94a3b8;font-size:0.85rem;">${teamAName} ${scoreA} - ${scoreB} ${teamBName}</div>` : ''}
    </div>
  </div>`;
}

// ===== RANKINGS =====
function renderRankings(rows) {
  const groupMatches = rows.filter(r => r.stage === 'group');
  const standings = calcStandings(groupMatches);
  const groups = ['A', 'B', 'C', 'D'];

  let html = '<div class="rankings-container">';

  groups.forEach(g => {
    const groupTeams = standings.filter(t => t.group === g);
    if (groupTeams.length === 0) return;

    html += `<div class="ranking-card">
      <div class="ranking-header">📊 Bảng ${g}</div>
      <div class="ranking-body">`;

    groupTeams.forEach((t, idx) => {
      const rankClass = idx === 0 ? 'rank-1' : idx === 1 ? 'rank-2' : idx === 2 ? 'rank-3' : 'rank-4';
      const isQualified = idx < 2;

      html += `<div class="ranking-item" style="${isQualified ? 'background:rgba(34,197,94,0.05);' : ''}">
        <div class="ranking-pos ${rankClass}">${idx + 1}</div>
        <div class="ranking-name">${isQualified ? ' ' : ''}${t.team}</div>
        <div class="ranking-stats">
          <span>${t.points} điểm</span> · 
          HS: ${t.diff > 0 ? '+' : ''}${t.diff} · 
          T/T: ${t.played}
        </div>
      </div>`;
    });

    html += '</div></div>';
  });

  html += '</div>';
  document.getElementById('tab-rankings').innerHTML = html;
}

// ===== STANDINGS CALCULATION =====
function calcStandings(matches) {
  const teamMap = {};

  matches.forEach(m => {
    const teamA = getTeamName(m.teamA);
    const teamB = getTeamName(m.teamB);
    const scoreA = m.scoreA;
    const scoreB = m.scoreB;
    const groupVal = m.group;
    const group = typeof groupVal === 'object' ? (groupVal.value || groupVal.label || 'A') : groupVal;

    if (!teamMap[teamA]) {
      teamMap[teamA] = { team: teamA, points: 0, diff: 0, played: 0, wins: 0, losses: 0, group: group };
    }
    if (!teamMap[teamB]) {
      teamMap[teamB] = { team: teamB, points: 0, diff: 0, played: 0, wins: 0, losses: 0, group: group };
    }

    if (scoreA != null && scoreB != null) {
      const sa = parseInt(scoreA);
      const sb = parseInt(scoreB);

      teamMap[teamA].played++;
      teamMap[teamB].played++;
      teamMap[teamA].diff += (sa - sb);
      teamMap[teamB].diff += (sb - sa);

      if (sa > sb) {
        teamMap[teamA].points += 2;
        teamMap[teamB].points += 0;
        teamMap[teamA].wins++;
        teamMap[teamB].losses++;
      } else if (sb > sa) {
        teamMap[teamB].points += 2;
        teamMap[teamA].points += 0;
        teamMap[teamB].wins++;
        teamMap[teamA].losses++;
      } else {
        teamMap[teamA].points += 1;
        teamMap[teamB].points += 1;
      }
    }
  });

  const sorted = Object.values(teamMap).sort((a, b) => {
    if (b.points !== a.points) return b.points - a.points;
    if (b.diff !== a.diff) return b.diff - a.diff;
    if (b.wins !== a.wins) return b.wins - a.wins;
    return b.played - a.played;
  });

  return sorted;
}

// ===== SAVE SCORE =====
async function saveScore(matchId, side, value) {
  const match = matchCache.find(r => r.id === matchId);
  if (!match) return;

  let newScoreA = match.scoreA ?? '';
  let newScoreB = match.scoreB ?? '';

  if (side === 'a') newScoreA = value !== '' ? parseInt(value) : '';
  else newScoreB = value !== '' ? parseInt(value) : '';

  // Update UI immediately
  const inputs = document.querySelectorAll(`[data-id="${matchId}"]`);
  inputs.forEach(inp => {
    if (inp.dataset.side === 'a') inp.value = newScoreA;
    if (inp.dataset.side === 'b') inp.value = newScoreB;
    inp.classList.add('saved');
    setTimeout(() => inp.classList.remove('saved'), 1000);
  });

  try {
    const body = {};
    if (newScoreA !== '' && newScoreA !== null) body.scoreA = newScoreA;
    if (newScoreB !== '' && newScoreB !== null) body.scoreB = newScoreB;

    // Also clear scores if both are empty
    if (newScoreA === '' || newScoreA === null) body.scoreA = null;
    if (newScoreB === '' || newScoreB === null) body.scoreB = null;

    const res = await fetch(`${API_BASE}${matchId}/?user_field_names=true`, {
      method: 'PATCH',
      headers: {
        Authorization: 'Token ' + TOKEN,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(body)
    });

    if (!res.ok) throw new Error('HTTP ' + res.status);

    // Update cache
    const cachedMatch = matchCache.find(r => r.id === matchId);
    if (cachedMatch) {
      cachedMatch.scoreA = newScoreA;
      cachedMatch.scoreB = newScoreB;
    }

    showToast(`Đã cập nhật điểm trận ${matchId}`);
  } catch (err) {
    showToast('Lỗi lưu điểm: ' + err.message, 'error');
    console.error(err);
  }
}

// ===== AUTO PROCESS ADVANCEMENT =====
async function autoProcess(rows) {
  const groupMatches = rows.filter(r => r.stage === 'group');
  const standings = calcStandings(groupMatches);
  const groups = ['A', 'B', 'C', 'D'];

  // Get top 2 from each group
  const qualified = {};
  groups.forEach(g => {
    const gTeams = standings.filter(t => t.group === g);
    if (gTeams.length >= 2) {
      qualified[g] = { first: gTeams[0].team, second: gTeams[1].team };
    }
  });

  // Check if all groups are ready
  const allGroupsReady = groups.every(g => qualified[g]);

  // Auto-create Quarter Finals
  if (allGroupsReady) {
    const existingQF = rows.filter(r => r.stage === 'quarter');

    // QF matchups: A1 vs B2, B1 vs A2, C1 vs D2, D1 vs C2
    const qfPairs = [
      { a: qualified['A'].first, b: qualified['B'].second, name: 'QF1' },
      { a: qualified['B'].first, b: qualified['A'].second, name: 'QF2' },
      { a: qualified['C'].first, b: qualified['D'].second, name: 'QF3' },
      { a: qualified['D'].first, b: qualified['C'].second, name: 'QF4' }
    ];

    // Check if we need to create QF matches
    const needCreate = qfPairs.some((pair, idx) => {
      const existing = existingQF.find(q => {
        const existingA = getTeamName(q.teamA);
        const existingB = getTeamName(q.teamB);
        return (existingA === pair.a && existingB === pair.b);
      });
      return !existing;
    });

    if (needCreate) {
      await createMatches(rows, 'quarter', qfPairs, 'group');
    }

    // Auto-create Semi Finals (after QF winners determined)
    const qfMatches = rows.filter(r => r.stage === 'quarter');
    const qfPlayed = qfMatches.filter(q => q.scoreA != null && q.scoreB != null);

    if (qfPlayed.length >= 4) {
      const qfWinners = qfPlayed.map(q => {
        const scoreA = parseInt(q.scoreA);
        const scoreB = parseInt(q.scoreB);
        return scoreA > scoreB ? getTeamName(q.teamA) : getTeamName(q.teamB);
      });

      const sfPairs = [
        { a: qfWinners[0] || 'TBD', b: qfWinners[1] || 'TBD', name: 'SF1' },
        { a: qfWinners[2] || 'TBD', b: qfWinners[3] || 'TBD', name: 'SF2' }
      ];

      const existingSF = rows.filter(r => r.stage === 'semi');
      const needCreateSF = sfPairs.some(pair => {
        return !existingSF.some(s => {
          return getTeamName(s.teamA) === pair.a && getTeamName(s.teamB) === pair.b;
        });
      });

      if (needCreateSF && qfWinners.every(w => w !== 'TBD')) {
        await createMatches(rows, 'semi', sfPairs, 'quarter');
      }

      // Auto-create Final (after SF winners determined)
      const sfMatches = rows.filter(r => r.stage === 'semi');
      const sfPlayed = sfMatches.filter(s => s.scoreA != null && s.scoreB != null);

      if (sfPlayed.length >= 2) {
        const sfWinners = sfPlayed.map(s => {
          const scoreA = parseInt(s.scoreA);
          const scoreB = parseInt(s.scoreB);
          return scoreA > scoreB ? getTeamName(s.teamA) : getTeamName(s.teamB);
        });

        const finalPair = { a: sfWinners[0] || 'TBD', b: sfWinners[1] || 'TBD', name: 'Final' };

        const existingFinal = rows.filter(r => r.stage === 'final');
        const needCreateFinal = !existingFinal.some(f => {
          return getTeamName(f.teamA) === finalPair.a && getTeamName(f.teamB) === finalPair.b;
        });

        if (needCreateFinal && sfWinners.every(w => w !== 'TBD')) {
          await createMatches(rows, 'final', [finalPair], 'semi');
        }
      }
    }
  }
}

// ===== CREATE MATCHES VIA API =====
async function createMatches(rows, stage, pairs, group) {
  for (const pair of pairs) {
    // Find if already exists
    const exists = rows.some(r => {
      if (r.stage !== stage) return false;
      const ea = getTeamName(r.teamA);
      const eb = getTeamName(r.teamB);
      return ea === pair.a && eb === pair.b;
    });

    if (!exists && pair.a !== 'TBD' && pair.b !== 'TBD') {
      const body = {
        stage: stage,
        group: group,
        teamA: pair.a,
        teamB: pair.b,
        matchName: pair.name || ''
      };

      try {
        const res = await fetch(API_BASE, {
          method: 'POST',
          headers: {
            Authorization: 'Token ' + TOKEN,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(body)
        });

        if (res.ok) {
          const data = await res.json();
          showToast(`Đã tạo trận ${pair.name}: ${pair.a} vs ${pair.b}`, 'info');
        } else {
          console.error('Failed to create match:', await res.text());
        }
      } catch (err) {
        console.error('Error creating match:', err);
      }
    }
  }
}
