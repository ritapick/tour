<script>
const API = "https://api.baserow.io/api/database/rows/table/962605/?user_field_names=true";
const TOKEN = "cCCbFgv5g7lTL2CEsAQcmOgO86ee52rm";

let cache = "";

// ===== LOAD =====
async function loadData() {
  const res = await fetch(API, {
    headers: { Authorization: "Token " + TOKEN }
  });
  const data = await res.json();

  const json = JSON.stringify(data.results);
  if (json === cache) return;

  cache = json;

  render(data.results);
  autoProcess(data.results);
}

// ===== RENDER =====
function render(rows) {
  const el = document.getElementById("app");
  el.innerHTML = "";

  rows.forEach(r => {
    const div = document.createElement("div");

    div.innerHTML = `
      [${r.stage}]
      ${r.teamA?.value || "TBD"}
      ${r.scoreA ?? "-"} :
      ${r.scoreB ?? "-"}
      ${r.teamB?.value || "TBD"}
    `;

    el.appendChild(div);
  });
}

// ===== AUTO LOGIC =====
async function autoProcess(rows) {
  const groupMatches = rows.filter(r => r.stage === "group");

  // chưa đấu xong → không xử lý
  if (groupMatches.some(m => m.scoreA == null || m.scoreB == null)) return;

  const table = calcRanking(groupMatches);
  const top = getTop2(table);

  await updateQuarter(rows, top);
  await updateSemi(rows);
  await updateFinal(rows);
}

// ===== TÍNH BXH =====
function calcRanking(matches) {
  const table = {};

  matches.forEach(m => {
    const A = m.teamA.value;
    const B = m.teamB.value;

    if (!table[A]) table[A] = { points: 0, diff: 0, group: m.group };
    if (!table[B]) table[B] = { points: 0, diff: 0, group: m.group };

    table[A].diff += (m.scoreA - m.scoreB);
    table[B].diff += (m.scoreB - m.scoreA);

    if (m.scoreA > m.scoreB) table[A].points++;
    else table[B].points++;
  });

  return table;
}

// ===== TOP 2 =====
function getTop2(table) {
  const groups = { A: [], B: [], C: [], D: [] };

  Object.entries(table).forEach(([team, data]) => {
    groups[data.group].push({ team, ...data });
  });

  Object.keys(groups).forEach(g => {
    groups[g].sort((a,b) =>
      b.points - a.points || b.diff - a.diff
    );
  });

  return {
    A1: groups.A[0].team,
    A2: groups.A[1].team,
    B1: groups.B[0].team,
    B2: groups.B[1].team,
    C1: groups.C[0].team,
    C2: groups.C[1].team,
    D1: groups.D[0].team,
    D2: groups.D[1].team
  };
}

// ===== UPDATE TỨ KẾT =====
async function updateQuarter(rows, top) {
  const quarter = rows.filter(r => r.stage === "quarter");

  const map = [
    [top.A1, top.B2],
    [top.B1, top.A2],
    [top.C1, top.D2],
    [top.D1, top.C2]
  ];

  for (let i = 0; i < quarter.length; i++) {
    const m = quarter[i];

    if (m.teamA?.value && m.teamB?.value) continue;

    await patch(m.id, map[i][0], map[i][1]);
  }
}

// ===== UPDATE BÁN KẾT =====
async function updateSemi(rows) {
  const quarter = rows.filter(r => r.stage === "quarter");
  const semi = rows.filter(r => r.stage === "semi");

  if (quarter.some(m => m.scoreA == null)) return;

  const winners = quarter.map(m =>
    m.scoreA > m.scoreB ? m.teamA.value : m.teamB.value
  );

  await patch(semi[0].id, winners[0], winners[2]);
  await patch(semi[1].id, winners[1], winners[3]);
}

// ===== UPDATE CHUNG KẾT =====
async function updateFinal(rows) {
  const semi = rows.filter(r => r.stage === "semi");
  const final = rows.find(r => r.stage === "final");

  if (semi.some(m => m.scoreA == null)) return;

  const winners = semi.map(m =>
    m.scoreA > m.scoreB ? m.teamA.value : m.teamB.value
  );

  await patch(final.id, winners[0], winners[1]);
}

// ===== PATCH =====
async function patch(id, A, B) {
  await fetch(`https://api.baserow.io/api/database/rows/table/962605/${id}/?user_field_names=true`, {
    method: "PATCH",
    headers: {
      Authorization: "Token " + TOKEN,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      teamA: A,
      teamB: B
    })
  });
}

// ===== LOOP =====
setInterval(loadData, 3000);
loadData();
</script>
