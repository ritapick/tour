<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏆 Giải Đấu Pickleball PRO</title>
<style>
@import url('https://cdn.jsdelivr.net/npm/fontsource-inter@5.1.0/400.css');
@import url('https://cdn.jsdelivr.net/npm/fontsource-inter@5.1.0/600.css');
@import url('https://cdn.jsdelivr.net/npm/fontsource-inter@5.1.0/700.css');
@import url('https://cdn.jsdelivr.net/npm/fontsource-inter@5.1.0/800.css');

*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:#0a0e1a;color:#e2e8f0;min-height:100vh;overflow-x:hidden;}

.header{background:linear-gradient(135deg,#1e3a5f 0%,#0f172a 50%,#1e3a5f 100%);padding:20px 20px 30px;text-align:center;border-bottom:3px solid #f59e0b;position:relative;overflow:hidden;}
.header::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(245,158,11,0.05) 0%,transparent 70%);animation:headerPulse 8s ease-in-out infinite;}
@keyframes headerPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.1);}}
.header h1{font-size:2rem;font-weight:800;color:#f59e0b;text-shadow:0 2px 10px rgba(245,158,11,0.3);position:relative;z-index:1;}
.header .subtitle{font-size:0.9rem;color:#94a3b8;margin-top:5px;position:relative;z-index:1;}
.header img{width:80px;height:80px;margin-bottom:10px;filter:drop-shadow(0 4px 15px rgba(245,158,11,0.4));position:relative;z-index:1;}
.status-bar{display:flex;justify-content:center;gap:20px;margin-top:15px;flex-wrap:wrap;position:relative;z-index:1;}
.status-item{background:rgba(255,255,255,0.08);padding:6px 16px;border-radius:20px;font-size:0.8rem;color:#cbd5e1;display:flex;align-items:center;gap:6px;}
.status-item .dot{width:8px;height:8px;border-radius:50%;background:#22c55e;animation:blink 1.5s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.3;}}

.tabs{display:flex;justify-content:center;gap:4px;padding:15px 10px;background:#0f172a;position:sticky;top:0;z-index:100;border-bottom:1px solid #1e293b;backdrop-filter:blur(10px);}
.tab-btn{padding:10px 24px;border:none;background:#1e293b;color:#94a3b8;border-radius:8px;cursor:pointer;font-size:0.9rem;font-weight:600;transition:all 0.3s;font-family:inherit;}
.tab-btn:hover{background:#334155;color:#e2e8f0;}
.tab-btn.active{background:linear-gradient(135deg,#f59e0b,#d97706);color:#0f172a;box-shadow:0 4px 15px rgba(245,158,11,0.3);}

.main{max-width:1200px;margin:0 auto;padding:20px 10px 40px;}
.tab-content{display:none;animation:fadeIn 0.4s ease;}
.tab-content.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

.groups-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-bottom:24px;}
.group-card{background:#1e293b;border-radius:12px;overflow:hidden;border:1px solid #334155;transition:all 0.3s;}
.group-card:hover{border-color:#f59e0b55;transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,0,0,0.3);}
.group-header{background:linear-gradient(135deg,#1e3a5f,#0f2744);padding:12px 16px;font-weight:700;font-size:1rem;color:#f59e0b;display:flex;align-items:center;gap:8px;}
.group-header .badge{background:#f59e0b;color:#0f172a;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:800;}

.match-card{background:#0f172a;margin:8px 12px;padding:12px;border-radius:8px;display:flex;align-items:center;justify-content:space-between;gap:10px;transition:all 0.3s;border:1px solid transparent;}
.match-card:hover{background:#1a2332;border-color:#334155;}
.match-card.played{border-left:3px solid #22c55e;}
.match-card.pending{border-left:3px solid #f59e0b;}
.match-teams{flex:1;display:flex;flex-direction:column;gap:6px;}
.match-row{display:flex;align-items:center;gap:8px;font-size:0.85rem;}
.match-row.winner .team-name{color:#22c55e;font-weight:600;}
.team-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.match-row .score{font-weight:700;font-size:1rem;min-width:28px;text-align:center;color:#f59e0b;}
.match-row .score-input{width:40px;padding:4px 2px;text-align:center;background:#1e293b;border:1px solid #334155;border-radius:6px;color:#f1f5f9;font-size:0.9rem;font-family:inherit;outline:none;transition:border-color 0.3s;}
.match-row .score-input:focus{border-color:#f59e0b;box-shadow:0 0 0 2px rgba(245,158,11,0.2);}
.match-row .score-input.saved{border-color:#22c55e;background:#0f271a;}
.match-vs{color:#475569;font-weight:700;font-size:0.75rem;margin:2px 0;}
.match-status{font-size:0.7rem;padding:3px 8px;border-radius:10px;font-weight:600;white-space:nowrap;}
.match-status.done{background:#22c55e22;color:#22c55e;}
.match-status.pending{background:#f59e0b22;color:#f59e0b;}

.bracket-container{overflow-x:auto;padding:20px 0;}
.bracket{display:flex;align-items:stretch;gap:0;min-width:900px;}
.bracket-round{display:flex;flex-direction:column;justify-content:center;min-width:200px;padding:0 10px;}
.bracket-round-title{text-align:center;font-size:0.75rem;font-weight:700;color:#f59e0b;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;padding:6px 12px;background:rgba(245,158,11,0.1);border-radius:6px;}
.bracket-matches{display:flex;flex-direction:column;justify-content:space-around;flex:1;gap:16px;}
.bracket-match{background:#1e293b;border-radius:10px;padding:10px;border:1px solid #334155;position:relative;transition:all 0.3s;}
.bracket-match:hover{border-color:#f59e0b55;}
.bracket-team{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:0.82rem;}
.bracket-team.winner .bracket-team-name{color:#22c55e;font-weight:600;}
.bracket-team-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bracket-team-score{font-weight:700;color:#f59e0b;margin-left:8px;}
.bracket-team.tbd .bracket-team-name{color:#475569;font-style:italic;}

.champion-section{text-align:center;padding:30px 20px;margin-top:20px;}
.champion-card{background:linear-gradient(135deg,#1e3a5f,#0f2744);border:2px solid #f59e0b;border-radius:16px;padding:30px;display:inline-block;max-width:400px;width:100%;position:relative;overflow:hidden;}
.champion-label{font-size:0.8rem;color:#f59e0b;font-weight:700;text-transform:uppercase;letter-spacing:2px;margin-bottom:10px;position:relative;}
.champion-trophy{font-size:3rem;margin-bottom:10px;position:relative;}
.champion-name{font-size:1.5rem;font-weight:800;color:#fff;position:relative;}
.champion-tbd{color:#475569;font-style:italic;}

.rankings-container{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;}
.ranking-card{background:#1e293b;border-radius:12px;overflow:hidden;border:1px solid #334155;}
.ranking-header{padding:12px 16px;font-weight:700;color:#f59e0b;border-bottom:1px solid #334155;}
.ranking-body{padding:8px 12px;}
.ranking-item{display:flex;align-items:center;padding:8px 4px;border-bottom:1px solid #0f172a;gap:10px;font-size:0.85rem;}
.ranking-item:last-child{border-bottom:none;}
.ranking-pos{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.75rem;flex-shrink:0;}
.ranking-name{flex:1;font-weight:600;}
.ranking-stats{text-align:right;font-size:0.75rem;color:#94a3b8;}
.ranking-stats span{color:#f59e0b;font-weight:600;}

.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:16px;}
.spinner{width:40px;height:40px;border:3px solid #334155;border-top-color:#f59e0b;border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-text{color:#94a3b8;font-size:0.9rem;}

.toast-container{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;}
.toast{padding:12px 20px;border-radius:8px;font-size:0.85rem;font-weight:600;animation:slideIn 0.3s ease;display:flex;align-items:center;gap:8px;box-shadow:0 8px 25px rgba(0,0,0,0.4);}
.toast.success{background:#0f271a;border:1px solid #22c55e;color:#22c55e;}
.toast.error{background:#2a0f0f;border:1px solid #ef4444;color:#ef4444;}
.toast.info{background:#0f172a;border:1px solid #3b82f6;color:#3b82f6;}
@keyframes slideIn{from{opacity:0;transform:translateX(100px);}to{opacity:1;transform:translateX(0);}}

@media(max-width:768px){
  .header h1{font-size:1.4rem;}
  .header img{width:60px;height:60px;}
  .groups-grid{grid-template-columns:1fr;}
  .match-card{flex-direction:column;align-items:flex-start;gap:6px;}
  .match-row{width:100%;}
  .bracket{min-width:700px;}
  .tab-btn{padding:8px 14px;font-size:0.8rem;}
  .status-bar{gap:10px;}
}
::-webkit-scrollbar{height:6px;width:6px;}
::-webkit-scrollbar-track{background:#0f172a;}
::-webkit-scrollbar-thumb{background:#334155;border-radius:3px;}
.empty-state{text-align:center;padding:40px 20px;color:#475569;}
.live-dot{width:10px;height:10px;border-radius:50%;background:#22c55e;display:inline-block;animation:pulse 2s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,0.4);}70%{box-shadow:0 0 0 10px rgba(34,197,94,0);}100%{box-shadow:0 0 0 0 rgba(34,197,94,0);}}
.footer{text-align:center;padding:20px;color:#475569;font-size:0.75rem;border-top:1px solid #1e293b;margin-top:20px;}
.sync-btn{background:transparent;border:1px solid #334155;color:#94a3b8;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:0.8rem;transition:all 0.3s;font-family:inherit;}
.sync-btn:hover{border-color:#f59e0b;color:#f59e0b;}
.sync-btn.spinning{animation:spin 0.8s linear infinite;}
</style>
</head>
<body>

<div class="header">
  <img src="https://image.qwenlm.ai/public_source/7c4f8ad5-e306-4d23-91b2-d10f6d405471/1a1f66184-bc00-4d8c-a520-ad7ae451f33b.png" alt="Pickleball Logo">
  <h1>🏆 GIẢI ĐẤU PICKLEBALL</h1>
  <div class="subtitle">Hệ thống quản lý giải đấu trực tiếp</div>
  <div class="status-bar">
    <div class="status-item"><span class="live-dot"></span> Đang đồng bộ</div>
    <div class="status-item" id="lastUpdate">Cập nhật: --:--:--</div>
    <div class="status-item" id="totalMatches">Tổng trận: 0</div>
    <div class="status-item"><button class="sync-btn" id="syncBtn" onclick="manualSync()">🔄 Đồng bộ</button></div>
  </div>
</div>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('groups')">📋 Vòng Bảng</button>
  <button class="tab-btn" onclick="switchTab('bracket')">🏅 Knockout</button>
  <button class="tab-btn" onclick="switchTab('rankings')">📊 Bảng Xếp Hạng</button>
</div>

<div class="main">
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <div class="loading-text">Đang tải dữ liệu...</div>
  </div>
  <div id="tab-groups" class="tab-content active"></div>
  <div id="tab-bracket" class="tab-content"></div>
  <div id="tab-rankings" class="tab-content"></div>
</div>

<div class="footer">Pickleball Tournament Manager © 2026 | Đồng bộ dữ liệu tự động mỗi 5s</div>
<div class="toast-container" id="toastContainer"></div>

<script>
const API_URL = "https://api.baserow.io/api/database/rows/table/962605/?user_field_names=true&order_by=id";
const TOKEN = "cCCbFgv5g7lTL2CEsAQcmOgO86ee52rm";

let matchCache = [];
let currentTab = 'groups';

// ===== PARSE HELPERS =====
function getVal(f){
  if(!f) return null;
  if(Array.isArray(f)) return f[0]?.value || f[0]?.name || f[0] || null;
  if(typeof f==='object') return f.value || f.name || null;
  return f;
}
function getName(f){
  if(!f) return 'TBD';
  if(Array.isArray(f)){
    return f.map(x=>x?.value||x?.name||x).filter(Boolean).join(' / ');
  }
  if(typeof f==='object') return f.value||f.name||'TBD';
  return f;
}
function showToast(msg, type = 'success') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = `<span>${type==='success'?'✅':type==='error'?'❌':'ℹ️'}</span> ${msg}`;
  container.appendChild(toast);
  setTimeout(()=>{toast.style.opacity='0';toast.style.transform='translateX(100px)';toast.style.transition='all 0.3s';setTimeout(()=>toast.remove(),300);},3000);
}
function formatTime(ts){return new Date(ts).toLocaleTimeString('vi-VN');}
function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach((btn,idx)=>btn.classList.toggle('active',['groups','bracket','rankings'][idx]===tab));
  document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
}

// ===== LOAD DATA =====
async function loadData(){
  try{
    const res = await fetch(API_URL, { headers:{ Authorization:"Token "+TOKEN } });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    const rows = data.results || [];

    const normalized = rows.map(r=>({
      id: r.id,
      stage: String(getVal(r.stage)||'group').toLowerCase().trim(),
      group: String(getVal(r.group)||'A').toUpperCase().trim(),
      teamA: getName(r.teamA),
      teamB: getName(r.teamB),
      scoreA: r.scoreA!=null ? parseInt(r.scoreA) : null,
      scoreB: r.scoreB!=null ? parseInt(r.scoreB) : null
    }));

    // Normalize stage names
    normalized.forEach(m=>{
      if(m.stage.includes('quarter')||m.stage.includes('tứ')||m.stage.includes('tu ket')) m.stage='quarter';
      else if(m.stage.includes('semi')||m.stage.includes('bán')||m.stage.includes('ban ket')) m.stage='semi';
      else if(m.stage.includes('final')||m.stage.includes('chung')||m.stage.includes('chungket')) m.stage='final';
      else m.stage='group';
    });

    const hasChanged = JSON.stringify(normalized.map(r=>r.id+'-'+r.scoreA+'-'+r.scoreB)) !== 
                       JSON.stringify(matchCache.map(r=>r.id+'-'+r.scoreA+'-'+r.scoreB));
    matchCache = normalized;

    document.getElementById('lastUpdate').textContent = 'Cập nhật: '+formatTime(new Date());
    document.getElementById('totalMatches').textContent = 'Tổng trận: '+rows.length;

    if(hasChanged || matchCache.length===0){
      document.getElementById('loading').style.display='flex';
      renderAll(normalized);
      setTimeout(()=>document.getElementById('loading').style.display='none',400);
    }
    autoProcess(normalized);
  }catch(err){
    console.error('Load error:',err);
    document.getElementById('loading').innerHTML=`<div style="text-align:center;color:#ef4444;"><div style="font-size:2rem;margin-bottom:10px;">⚠️</div><p>Lỗi kết nối</p><button onclick="loadData()" style="margin-top:10px;padding:6px 12px;background:#334155;color:#fff;border:1px solid #475569;border-radius:4px;cursor:pointer;">Thử lại</button></div>`;
  }
}
function manualSync(){
  const btn=document.getElementById('syncBtn');btn.classList.add('spinning');btn.disabled=true;
  loadData().finally(()=>{setTimeout(()=>{btn.classList.remove('spinning');btn.disabled=false;},500);});
}

// ===== RENDER =====
function renderAll(rows){renderGroupStage(rows);renderBracket(rows);renderRankings(rows);}

function renderGroupStage(rows){
  const groups=['A','B','C','D'];
  const groupRows=rows.filter(r=>r.stage==='group');
  let html='<div class="groups-grid">';
  groups.forEach(g=>{
    const gMatches=groupRows.filter(r=>r.group===g);
    html+=`<div class="group-card"><div class="group-header"><span class="badge">${g}</span> Bảng ${g}</div>`;
    if(gMatches.length===0) html+=`<div class="empty-state">🏓 Chưa có trận đấu</div>`;
    else{
      gMatches.forEach(m=>{
        const sa=m.scoreA??''; const sb=m.scoreB??'';
        const played=sa!==''&&sb!=='';
        const aWin=played&&sa>sb; const bWin=played&&sb>sa;
        html+=`<div class="match-card ${played?'played':'pending'}">
          <div class="match-teams">
            <div class="match-row ${aWin?'winner':''}"><span class="team-name">${m.teamA}</span><input type="number" class="score-input" value="${sa}" data-id="${m.id}" data-side="a" onchange="saveScore(${m.id},'a',this.value)" onfocus="this.select()" min="0"></div>
            <div class="match-vs">VS</div>
            <div class="match-row ${bWin?'winner':''}"><span class="team-name">${m.teamB}</span><input type="number" class="score-input" value="${sb}" data-id="${m.id}" data-side="b" onchange="saveScore(${m.id},'b',this.value)" onfocus="this.select()" min="0"></div>
          </div>
          <span class="match-status ${played?'done':'pending'}">${played?'✓ Đã đấu':'⏳'}</span>
        </div>`;
      });
    }
    html+=`</div>`;
  });
  html+='</div>'; document.getElementById('tab-groups').innerHTML=html;
}

function renderBracket(rows){
  const qf=rows.filter(r=>r.stage==='quarter');
  const sf=rows.filter(r=>r.stage==='semi');
  const fn=rows.filter(r=>r.stage==='final');
  let html='<div class="bracket-container"><div class="bracket">';
  html+=renderRound('Tứ Kết',qf,4); html+=renderRound('Bán Kết',sf,2); html+=renderRound('Chung Kết',fn,1);
  html+='</div></div>'+renderChampion(rows);
  document.getElementById('tab-bracket').innerHTML=html;
}
function renderRound(title,matches,count){
  let html=`<div class="bracket-round"><div class="bracket-round-title">${title}</div><div class="bracket-matches">`;
  if(!matches.length) for(let i=0;i<count;i++) html+=`<div class="bracket-match"><div class="bracket-team tbd"><span class="bracket-team-name">TBD</span><span class="bracket-team-score">-</span></div><div style="text-align:center;color:#475569;padding:4px;">vs</div><div class="bracket-team tbd"><span class="bracket-team-name">TBD</span><span class="bracket-team-score">-</span></div></div>`;
  else matches.forEach(m=>{
    const sa=m.scoreA??''; const sb=m.scoreB??'';
    const played=sa!==''&&sb!=='';
    html+=`<div class="bracket-match">
      <div class="bracket-team ${played&&sa>sb?'winner':''} ${m.teamA==='TBD'?'tbd':''}"><span class="bracket-team-name">${m.teamA}</span><span class="bracket-team-score">${sa!==''?sa:'-'}</span></div>
      <div style="text-align:center;color:#475569;padding:4px;"><input type="number" class="score-input" value="${sa}" style="width:32px;" data-id="${m.id}" data-side="a" onchange="saveScore(${m.id},'a',this.value)" min="0">-<input type="number" class="score-input" value="${sb}" style="width:32px;" data-id="${m.id}" data-side="b" onchange="saveScore(${m.id},'b',this.value)" min="0"></div>
      <div class="bracket-team ${played&&sb>sa?'winner':''} ${m.teamB==='TBD'?'tbd':''}"><span class="bracket-team-name">${m.teamB}</span><span class="bracket-team-score">${sb!==''?sb:'-'}</span></div>
    </div>`;
  });
  return html+'</div></div>';
}
function renderChampion(rows){
  const fn=rows.filter(r=>r.stage==='final');
  if(!fn.length) return `<div class="champion-section"><div class="champion-card"><div class="champion-label">🏆 Nhà Vô Địch</div><div class="champion-trophy">🏆</div><div class="champion-name champion-tbd">Chưa xác định</div></div></div>`;
  const m=fn[0]; const played=m.scoreA!=null&&m.scoreB!=null;
  const champ=played?(m.scoreA>m.scoreB?m.teamA:m.teamB):'<span class="champion-tbd">Chưa xác định</span>';
  return `<div class="champion-section"><div class="champion-card"><div class="champion-label">🏆 NHÀ VÔ ĐỊCH</div><div class="champion-trophy">${played?'🏆':'⏳'}</div><div class="champion-name">${champ}</div>${played?`<div style="margin-top:8px;color:#94a3b8;font-size:0.85rem;">${m.teamA} <b style="color:#f59e0b;">${m.scoreA}</b> - <b style="color:#f59e0b;">${m.scoreB}</b> ${m.teamB}</div>`:''}</div></div>`;
}

function renderRankings(rows){
  const gRows=rows.filter(r=>r.stage==='group');
  const st=calcStandings(gRows);
  let html='<div class="rankings-container">';
  ['A','B','C','D'].forEach(g=>{
    const gTeams=st.filter(t=>t.group===g);
    if(!gTeams.length) return;
    html+=`<div class="ranking-card"><div class="ranking-header">📊 Bảng ${g}</div><div class="ranking-body">`;
    gTeams.forEach((t,idx)=>{
      const rc=idx===0?'rank-1':idx===1?'rank-2':idx===2?'rank-3':'rank-4';
      html+=`<div class="ranking-item" style="${idx<2?'background:rgba(34,197,94,0.05);border-radius:6px;':''}"><div class="ranking-pos ${rc}">${idx+1}</div><div class="ranking-name">${t.team}</div><div class="ranking-stats"><span>${t.points}đ</span>·HS:${t.diff>0?'+':''}${t.diff}·T:${t.wins}·B:${t.losses}</div></div>`;
    });
    html+='</div></div>';
  });
  html+='</div>'; document.getElementById('tab-rankings').innerHTML=html;
}
function calcStandings(matches){
  const map={};
  matches.forEach(m=>{
    ['teamA','teamB'].forEach(k=>{if(!map[m[k]])map[m[k]]={team:m[k],points:0,diff:0,played:0,wins:0,losses:0,group:m.group};});
    if(m.scoreA!=null&&m.scoreB!=null){
      map[m.teamA].played++; map[m.teamB].played++;
      map[m.teamA].diff+=(m.scoreA-m.scoreB); map[m.teamB].diff+=(m.scoreB-m.scoreA);
      if(m.scoreA>m.scoreB){map[m.teamA].points+=3;map[m.teamA].wins++;map[m.teamB].losses++;}
      else if(m.scoreB>m.scoreA){map[m.teamB].points+=3;map[m.teamB].wins++;map[m.teamA].losses++;}
      else{map[m.teamA].points++;map[m.teamB].points++;}
    }
  });
  return Object.values(map).sort((a,b)=>b.points-a.points||b.diff-a.diff||b.wins-a.wins);
}

// ===== SAVE =====
async function saveScore(id,side,val){
  const match=matchCache.find(r=>r.id===id); if(!match)return;
  const nv=val!==''?parseInt(val):null;
  if(side==='a')match.scoreA=nv; else match.scoreB=nv;
  const inputs=document.querySelectorAll(`[data-id="${id}"]`);
  inputs.forEach(inp=>{if(inp.dataset.side===side)inp.value=val!==''?val:'';inp.classList.add('saved');setTimeout(()=>inp.classList.remove('saved'),1000);});
  try{
    const body={scoreA:match.scoreA,scoreB:match.scoreB};
    await fetch(`${API_URL.split('?')[0]}${id}/?user_field_names=true`,{method:'PATCH',headers:{Authorization:'Token '+TOKEN,'Content-Type':'application/json'},body:JSON.stringify(body)});
    showToast('Đã cập nhật điểm'); renderAll(matchCache);
  }catch(e){showToast('Lỗi lưu: '+e.message,'error');}
}

// ===== AUTO PROCESS =====
let lock=false;
async function autoProcess(rows){
  if(lock)return; lock=true;
  try{
    const st=calcStandings(rows.filter(r=>r.stage==='group'));
    const q={};
    ['A','B','C','D'].forEach(g=>{const t=st.filter(x=>x.group===g);if(t.length>=2)q[g]={first:t[0].team,second:t[1].team};});
    if(['A','B','C','D'].every(g=>q[g])){
      await autoCreate(rows,'quarter',[{a:q.A.first,b:q.B.second},{a:q.B.first,b:q.A.second},{a:q.C.first,b:q.D.second},{a:q.D.first,b:q.C.second}]);
      const qfP=rows.filter(r=>r.stage==='quarter'&&r.scoreA!=null&&r.scoreB!=null);
      if(qfP.length===4){const w=qfP.map(q=>q.scoreA>q.scoreB?q.teamA:q.teamB);if(!w.includes('TBD'))await autoCreate(rows,'semi',[{a:w[0],b:w[1]},{a:w[2],b:w[3]}]);}
      const sfP=rows.filter(r=>r.stage==='semi'&&r.scoreA!=null&&r.scoreB!=null);
      if(sfP.length===2){const w=sfP.map(s=>s.scoreA>s.scoreB?s.teamA:s.teamB);if(!w.includes('TBD'))await autoCreate(rows,'final',[{a:w[0],b:w[1]}]);}
    }
  }finally{lock=false;}
}
async function autoCreate(rows,stage,pairs){
  for(const p of pairs){
    if(rows.some(r=>r.stage===stage&&r.teamA===p.a&&r.teamB===p.b))continue;
    try{
      await fetch(API_URL,{method:'POST',headers:{Authorization:'Token '+TOKEN,'Content-Type':'application/json'},body:JSON.stringify({stage,group:stage.toLowerCase(),teamA:p.a,teamB:p.b})});
      showToast(`Đã tạo trận: ${p.a} vs ${p.b}`,'info'); loadData();
    }catch(e){console.error(e);}
  }
}

loadData(); setInterval(loadData,5000);
