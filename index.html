<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pickleball Tournament</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#0f172a;
  color:white;
}

h2 { text-align:center; }

.container {
  display:flex;
  flex-direction:column;
  gap:20px;
  padding:10px;
}

/* ===== RANKING ===== */
.ranking {
  background:#1e293b;
  padding:10px;
  border-radius:10px;
}

.team-row {
  display:flex;
  justify-content:space-between;
  padding:5px 0;
  border-bottom:1px solid #334155;
}

/* ===== BRACKET ===== */
.bracket {
  display:flex;
  overflow-x:auto;
  gap:20px;
}

.round {
  min-width:150px;
}

.match {
  background:#1e293b;
  padding:8px;
  margin:10px 0;
  border-radius:8px;
  font-size:14px;
}

input {
  width:30px;
  text-align:center;
}

/* MOBILE */
@media (max-width:600px) {
  .bracket {
    flex-direction:column;
  }
}
</style>
</head>

<body>

<h2>🏆 Pickleball Tournament</h2>

<div class="container">

  <div id="ranking" class="ranking"></div>

  <div class="bracket">
    <div class="round" id="group"></div>
    <div class="round" id="quarter"></div>
    <div class="round" id="semi"></div>
    <div class="round" id="final"></div>
  </div>

</div>

<script>
const API = "https://api.baserow.io/api/database/rows/table/962605/?user_field_names=true";
const TOKEN = "cCCbFgv5g7lTL2CEsAQcmOgO86ee52rm";

let cache = "";

// ===== LOAD =====
async function loadData() {
  const res = await fetch(API, {
    headers: { Authorization: "Token " + TOKEN }
  });
  const data = await res.json();

  const json = JSON.stringify(data.results);
  if (json === cache) return;

  cache = json;

  renderAll(data.results);
  autoProcess(data.results);
}

// ===== RENDER ALL =====
function renderAll(rows) {
  renderBracket(rows);
  renderRanking(rows);
}

// ===== BRACKET =====
function renderBracket(rows) {
  const stages = ["group","quarter","semi","final"];

  stages.forEach(stage => {
    const el = document.getElementById(stage);
    el.innerHTML = `<h3>${stage.toUpperCase()}</h3>`;

    rows.filter(r => r.stage === stage).forEach(r => {
      el.innerHTML += `
        <div class="match">
          ${r.teamA?.value || "TBD"}
          <input value="${r.scoreA ?? ""}" onchange="save(${r.id})" id="a${r.id}">
          :
          <input value="${r.scoreB ?? ""}" onchange="save(${r.id})" id="b${r.id}">
          ${r.teamB?.value || "TBD"}
        </div>
      `;
    });
  });
}

// ===== RANKING =====
function renderRanking(rows) {
  const groupMatches = rows.filter(r => r.stage === "group");
  const table = calcRanking(groupMatches);

  const groups = groupBy(table);

  let html = "<h3>🏅 Bảng xếp hạng</h3>";

  Object.keys(groups).forEach(g => {
    html += `<b>Bảng ${g}</b>`;

    groups[g].forEach(t => {
      html += `
        <div class="team-row">
          <span>${t.team}</span>
          <span>${t.points} (${t.diff})</span>
        </div>
      `;
    });
  });

  document.getElementById("ranking").innerHTML = html;
}

// ===== LOGIC BXH =====
function calcRanking(matches) {
  const table = {};

  matches.forEach(m => {
    if (m.scoreA == null) return;

    const A = m.teamA.value;
    const B = m.teamB.value;

    if (!table[A]) table[A] = { team:A, points:0, diff:0, group:m.group };
    if (!table[B]) table[B] = { team:B, points:0, diff:0, group:m.group };

    table[A].diff += (m.scoreA - m.scoreB);
    table[B].diff += (m.scoreB - m.scoreA);

    if (m.scoreA > m.scoreB) table[A].points++;
    else table[B].points++;
  });

  return table;
}

// ===== GROUP BY =====
function groupBy(table) {
  const groups = { A:[], B:[], C:[], D:[] };

  Object.values(table).forEach(t => {
    groups[t.group].push(t);
  });

  Object.keys(groups).forEach(g => {
    groups[g].sort((a,b)=>
      b.points - a.points || b.diff - a.diff
    );
  });

  return groups;
}

// ===== SAVE =====
async function save(id) {
  const a = parseInt(document.getElementById("a"+id).value);
  const b = parseInt(document.getElementById("b"+id).value);

  await fetch(`https://api.baserow.io/api/database/rows/table/962605/${id}/?user_field_names=true`, {
    method:"PATCH",
    headers:{
      Authorization:"Token "+TOKEN,
      "Content-Type":"application/json"
    },
    body: JSON.stringify({ scoreA:a, scoreB:b })
  });
}

// ===== AUTO (giữ nguyên logic trước) =====
async function autoProcess(rows) {
  // bạn giữ nguyên phần auto tứ kết mình đã viết trước
}

// ===== LOOP =====
setInterval(loadData,3000);
loadData();
</script>

</body>
</html>
