<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏆 Pickleball Tournament PRO</title>

<style>
body{font-family:sans-serif;background:#0f172a;color:#e2e8f0;padding:20px}
h1{color:#f59e0b;text-align:center}
.card{background:#1e293b;padding:12px;border-radius:10px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;margin:4px 0}
input{width:50px;text-align:center;background:#0f172a;color:#fff;border:1px solid #334155;border-radius:6px}
.badge{color:#22c55e;font-size:12px}
</style>
</head>

<body>

<h1>🏆 PICKLEBALL</h1>

<div id="app">Loading...</div>

<script>
const API = "https://api.baserow.io/api/database/rows/table/962605/?user_field_names=true&order_by=id";
const TOKEN = "YOUR_TOKEN";

// ===== PARSE FIELD =====
function getVal(f){
  if(!f) return null;
  if(Array.isArray(f)) return f[0]?.value || f[0]?.name || f[0] || null;
  if(typeof f==='object') return f.value || f.name || null;
  return f;
}

function getName(f){
  if(!f) return 'TBD';
  if(Array.isArray(f)){
    return f.map(x=>x.value||x.name||x).join(' / ');
  }
  if(typeof f==='object') return f.value||f.name||'TBD';
  return f;
}

// ===== LOAD =====
async function load(){
  const res = await fetch(API,{
    headers:{Authorization:"Token "+TOKEN}
  });

  const data = await res.json();
  render(data.results);
}

// ===== RENDER =====
function render(rows){
  const group = rows.filter(r=>getVal(r.stage)==='group');

  let html='';

  group.forEach(m=>{
    const a = getName(m.teamA);
    const b = getName(m.teamB);
    const sa = m.scoreA ?? '';
    const sb = m.scoreB ?? '';

    html+=`
    <div class="card">
      <div class="row">
        <span>${a}</span>
        <input value="${sa}" onchange="save(${m.id},'A',this.value)">
      </div>
      <div class="row">
        <span>${b}</span>
        <input value="${sb}" onchange="save(${m.id},'B',this.value)">
      </div>
      <div class="badge">${getVal(m.group)||''}</div>
    </div>
    `;
  });

  document.getElementById('app').innerHTML = html || 'Không có dữ liệu';
}

// ===== SAVE =====
async function save(id,side,val){
  const body = {};
  if(side==='A') body.scoreA = val===''?null:parseInt(val);
  if(side==='B') body.scoreB = val===''?null:parseInt(val);

  await fetch(`https://api.baserow.io/api/database/rows/table/962605/${id}/?user_field_names=true`,{
    method:'PATCH',
    headers:{
      Authorization:'Token '+TOKEN,
      'Content-Type':'application/json'
    },
    body:JSON.stringify(body)
  });

  load();
}

// AUTO REFRESH
load();
setInterval(load,5000);
</script>

</body>
</html>
